name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e . pytest pytest-cov ruff mypy
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy planner
      - run: pytest --cov=planner
