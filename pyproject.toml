[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-resource-planner"
version = "0.1.0"
description = "Planning delegate: an intelligent agent that knows its limits"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jie Shen Yeap" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "gradio[oauth]",
    "langgraph",
    "langchain-core",
    "langchain-openai",
    "pandas>=3.1",
    "pydantic>=2",
    "pydantic-settings",
]

[project.urls]
Repository = "https://github.com/YeapJieShen/WQF7002-Assignment1"

[project.scripts]
planner = "planner.__main__:main"

[dependency-groups]
# Exact pins (no lockfile): a tool release cannot break CI without a reviewed bump (Dependabot opens it).
dev = [
    "hypothesis==6.170.11",
    "import-linter==2.15",
    "mypy==2.4.0",
    "pandas-stubs==3.1.0.261029",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
]
# What the ZeroGPU Space adds, as ranges; space/requirements.txt holds the exact pins. Never needed for tests or CI.
space = [
    "spaces",
    "torch",
    "transformers>=4.56",  # Qwen3 support and the `dtype` argument
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
planner = ["py.typed", "resources/**/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",     # conflicts with D211
    "D213",     # conflicts with D212
    "COM812",   # conflicts with the formatter
    "ISC001",   # conflicts with the formatter
    "CPY",
    "EM",       # exception message variables add noise for pydantic validator errors
    "TRY003",
    "TD",
    "FIX",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "PLR2004", "ANN", "D", "SLF001", "DTZ"]  # DTZ: times are naive by design; S311: seeded example picks
"scripts/**" = ["INP001", "T201"]  # standalone scripts run by path and print progress
"space/**" = ["INP001"]  # the Space's entry point, run by path

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "planner.domain.models.Frozen",
    "planner.app.tools.args.ToolArgs",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts", "space/app.py"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]

[[tool.mypy.overrides]]
# Space-only libraries, imported lazily in adapters/zerogpu.py; not installed for type checks.
module = ["spaces", "transformers"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: needs a live LLM backend (never run in CI)"]
addopts = "-m 'not llm' --strict-markers --strict-config"

[tool.coverage.run]
source = ["planner"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_also = ["pragma: no cover"]

[tool.importlinter]
root_package = "planner"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers point inward: adapters -> app -> domain"
type = "layers"
layers = ["planner.adapters", "planner.app", "planner.domain"]

[[tool.importlinter.contracts]]
name = "Domain and app stay framework-free"
type = "forbidden"
source_modules = ["planner.domain", "planner.app"]
forbidden_modules = [
    "langgraph",
    "langchain",
    "langchain_core",
    "langchain_community",
    "langchain_openai",
    "openai",
    "gradio",
    "transformers",
    "torch",
    "spaces",
    "pandas",
]
